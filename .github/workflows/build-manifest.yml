name: Cập nhật danh sách ảnh

# Mỗi khi thêm / xóa / đổi ảnh trong photos/, tự tạo lại photos.json và thumbs/
on:
  push:
    branches: [main]
    paths:
      - "photos/**"
      - "tools/build-manifest.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 tools/build-manifest.py
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.json thumbs
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
          else
            git commit -m "Cập nhật photos.json và thumbs"
            git push
          fi
